<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent trace span handmade illustration</title>
  <desc id="desc">Craft handmade style illustration showing an Agent machine creating root span, child spans, timing data, business data and print output.</desc>
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="roughen">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
    <pattern id="paperGrain" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fbf8ef"/>
      <circle cx="12" cy="18" r="1.2" fill="#d9c8aa" opacity="0.35"/>
      <circle cx="48" cy="36" r="0.9" fill="#d7c4a7" opacity="0.3"/>
      <path d="M6 58 C20 50,35 66,59 52" stroke="#e2d5bd" stroke-width="1" fill="none" opacity="0.35"/>
    </pattern>
    <style>
      .bg{fill:url(#paperGrain)}
      .line{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#roughen)}
      .thread{fill:none;stroke:#df6d16;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#roughen)}
      .threadThin{fill:none;stroke:#df6d16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#roughen)}
      .dash{fill:none;stroke:#171717;stroke-width:3.5;stroke-dasharray:12 12;stroke-linecap:round;filter:url(#roughen)}
      .tag{fill:#d7b98a;stroke:#171717;stroke-width:2.5;filter:url(#paperShadow)}
      .tag2{fill:#ead6b4;stroke:#171717;stroke-width:2.5;filter:url(#paperShadow)}
      .blue{fill:#b8d2df;stroke:#171717;stroke-width:2.2;filter:url(#paperShadow)}
      .white{fill:#fffdf7;stroke:#171717;stroke-width:2.2;filter:url(#paperShadow)}
      .red{fill:#d84a35;color:#d84a35}
      .small{font: 28px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .med{font: 38px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .big{font: 48px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .note{font: 32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .redText{font: 32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#d84a35}
      .blueText{font: 30px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#227093}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <!-- context note -->
  <path class="blue" d="M188 89 L405 74 L416 268 L176 286 Z"/>
  <path d="M285 70 l90 -20 l20 42 l-97 18 z" fill="#d4b06b" opacity="0.75"/>
  <text class="med" x="235" y="137">上下文</text>
  <text class="small" x="220" y="185">- 当前 span</text>
  <text class="small" x="220" y="226">- 子 span</text>
  <text class="small" x="220" y="267">- 业务数据</text>

  <!-- agent machine -->
  <path class="tag2" d="M165 380 L397 360 L415 655 L135 678 L124 410 Z"/>
  <text class="big" x="205" y="448">Agent</text>
  <rect x="210" y="486" width="125" height="88" rx="20" fill="#161616"/>
  <circle cx="249" cy="529" r="11" fill="#fff7de"/>
  <circle cx="296" cy="529" r="11" fill="#fff7de"/>
  <path d="M242 557 C263 570,288 570,309 556" stroke="#fff7de" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="240" cy="372" r="22" fill="#c9642d" stroke="#111" stroke-width="3"/>
  <path class="line" d="M240 394 L240 486"/>
  <circle cx="390" cy="566" r="38" fill="#c5a66f" stroke="#111" stroke-width="3"/>
  <path class="line" d="M390 528 v76 M352 566 h76"/>
  <path class="white" d="M178 605 L322 626 L296 737 L147 708 Z"/>
  <path class="line" d="M200 642 h78 M194 675 h94 M190 707 h70"/>
  <path class="white" d="M62 367 L155 356 L178 418 L71 431 Z"/>
  <text class="med" x="86" y="407">start</text>
  <path class="dash" d="M138 417 C114 462,130 504,160 525"/>
  <path class="white" d="M70 746 L162 733 L183 793 L83 805 Z"/>
  <text class="med" x="102" y="784">end</text>
  <path class="dash" d="M194 716 C151 725,120 746,105 766"/>

  <!-- threads -->
  <path class="thread" d="M407 497 C520 470,520 235,665 220"/>
  <path class="thread" d="M794 328 L794 395"/>
  <path class="thread" d="M794 328 C651 332,570 360,520 450"/>
  <path class="thread" d="M794 328 C940 332,1015 350,1076 444"/>
  <path class="thread" d="M794 328 C802 468,802 590,802 690"/>
  <path class="thread" d="M924 218 C1110 227,1232 288,1323 388"/>
  <path class="thread" d="M1184 496 C1268 492,1310 482,1358 470"/>
  <path class="thread" d="M1190 568 C1264 580,1302 588,1350 612"/>
  <path class="thread" d="M1180 650 C1260 688,1292 705,1345 730"/>

  <!-- root span -->
  <path class="tag" d="M647 150 L914 137 L938 284 L630 297 Z"/>
  <circle cx="665" cy="220" r="12" fill="#f6efe2" stroke="#111" stroke-width="4"/>
  <text class="big" x="708" y="205">root span</text>
  <text class="small" x="708" y="250">start 10:00</text>
  <text class="small" x="708" y="286">end   10:08</text>
  <text class="redText" x="840" y="286">8.0s</text>
  <circle cx="872" cy="181" r="34" fill="none" stroke="#111" stroke-width="4"/>
  <path class="line" d="M872 181 v-22 M872 181 l20 13"/>

  <!-- callout -->
  <path class="dash" d="M1005 154 C1052 128,1136 127,1172 165 C1206 201,1176 246,1110 253 L1025 255 C980 244,967 186,1005 154 Z"/>
  <text class="note" x="1030" y="202">一次流程的</text>
  <text class="note" x="1049" y="240">完整链路</text>
  <path class="dash" d="M1002 235 C974 236,952 250,936 268"/>

  <!-- child spans -->
  <path class="tag" d="M501 408 L704 392 L724 547 L482 556 Z"/>
  <circle cx="695" cy="445" r="27" fill="none" stroke="#111" stroke-width="3.5"/>
  <path class="line" d="M695 445 v-18 M695 445 l15 10"/>
  <text class="med" x="530" y="466">turn</text>
  <text class="small" x="529" y="512">start / end</text>
  <text class="redText" x="561" y="548">2.1s</text>

  <path class="tag" d="M754 398 L957 388 L975 552 L736 560 Z"/>
  <circle cx="930" cy="445" r="27" fill="none" stroke="#111" stroke-width="3.5"/>
  <path class="line" d="M930 445 v-18 M930 445 l15 10"/>
  <text class="med" x="786" y="463">tool</text>
  <text class="small" x="786" y="512">start / end</text>
  <text class="redText" x="815" y="548">2.39s</text>
  <path d="M982 518 l42 74 l-86 -3 z" fill="#d84a35" stroke="#111" stroke-width="3"/>
  <text x="969" y="577" font-size="52" font-family="Marker Felt, Comic Sans MS, cursive" fill="#fff">!</text>

  <path class="tag" d="M1002 408 L1188 394 L1210 552 L981 562 Z"/>
  <circle cx="1164" cy="445" r="27" fill="none" stroke="#111" stroke-width="3.5"/>
  <path class="line" d="M1164 445 v-18 M1164 445 l15 10"/>
  <text class="med" x="1024" y="463">thinking</text>
  <text class="small" x="1025" y="512">start / end</text>
  <text class="redText" x="1060" y="548">2.19s</text>

  <path class="tag" d="M736 650 L959 637 L981 790 L715 802 Z"/>
  <circle cx="930" cy="694" r="27" fill="none" stroke="#111" stroke-width="3.5"/>
  <path class="line" d="M930 694 v-18 M930 694 l15 10"/>
  <text class="med" x="781" y="705">子 span</text>
  <text class="small" x="780" y="753">存回上下文</text>
  <text class="blueText" x="778" y="789">继续挂载</text>

  <!-- notebook output -->
  <path d="M1348 311 L1533 309 L1533 779 L1328 781 L1328 331 Z" fill="#caa978" stroke="#111" stroke-width="2" filter="url(#paperShadow)"/>
  <path class="white" d="M1295 292 L1506 276 L1535 742 L1300 754 Z"/>
  <path class="line" d="M1335 329 C1337 279,1362 278,1364 329 M1392 325 C1391 277,1418 277,1419 325 M1447 320 C1447 274,1470 274,1472 320"/>
  <circle cx="1361" cy="392" r="33" fill="none" stroke="#111" stroke-width="4"/>
  <path class="line" d="M1361 392 v-20 M1361 392 l18 10"/>
  <text class="big" x="1418" y="408">耗时</text>
  <path class="threadThin" d="M1419 420 h84"/>
  <path class="line" d="M1333 503 h56 v56 h-56 z M1349 518 l21 13 l-21 13"/>
  <text class="big" x="1418" y="548">业务数据</text>
  <path class="threadThin" d="M1417 561 h120"/>
  <path class="line" d="M1333 637 h60 v48 h-60 z M1353 653 l16 11 l-16 11 M1376 682 h20"/>
  <text class="big" x="1418" y="678">print</text>
  <path class="threadThin" d="M1417 690 h92"/>

  <!-- bottom note -->
  <path class="blue" d="M1240 785 L1492 765 L1510 862 L1222 872 Z"/>
  <path d="M1280 765 l96 -28 l18 43 l-100 26 z" fill="#d4b06b" opacity="0.75"/>
  <text class="small" x="1270" y="820">- 每一步耗时</text>
  <text class="small" x="1270" y="858">- 最终打印结果</text>
</svg>
