<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t01 d01">
  <title id="t01">Deny / guard rejection</title>
  <desc id="d01">Tool call denied by guard, returning a post-result Error with no permission.</desc>
  <defs>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter>
    <filter id="rg"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter>
    <pattern id="pg" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fbf8ef"/>
      <circle cx="12" cy="18" r="1.2" fill="#d9c8aa" opacity="0.35"/>
      <circle cx="48" cy="36" r="0.9" fill="#d7c4a7" opacity="0.3"/>
      <path d="M6 58 C20 50,35 66,59 52" stroke="#e2d5bd" stroke-width="1" fill="none" opacity="0.35"/>
    </pattern>
    <style>
      .bg{fill:url(#pg)}
      .ln{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .th{fill:none;stroke:#df6d16;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .thn{fill:none;stroke:#df6d16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .ds{fill:none;stroke:#171717;stroke-width:3.5;stroke-dasharray:12 12;stroke-linecap:round;filter:url(#rg)}
      .tg{fill:#d7b98a;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .tg2{fill:#ead6b4;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .bl{fill:#b8d2df;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .wh{fill:#fffdf7;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .sm{font:28px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .md{font:38px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .lg{font:48px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .rt{font:32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#d84a35}
      .bt{font:30px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#227093}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <!-- title -->
  <path class="bl" d="M80 62 L470 44 L486 142 L62 147 Z"/>
  <text class="lg" x="120" y="123">没有权限 · 拒绝</text>

  <!-- guard gate -->
  <rect x="560" y="180" width="90" height="520" rx="10" class="wh" stroke-width="6"/>
  <rect x="590" y="180" width="30" height="520" class="wh" stroke-width="6"/>
  <circle cx="575" cy="430" r="18" fill="#f6efe2" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M575 430 v-12 M575 430 l12 8"/>
  <!-- guard plate -->
  <path class="tg" d="M500 140 L700 124 L716 214 L482 226 Z"/>
  <text class="md" x="545" y="188">guard</text>

  <!-- xiaohei with deny stamp -->
  <ellipse cx="330" cy="430" rx="34" ry="36" fill="#161616" filter="url(#rg)"/>
  <circle cx="314" cy="420" r="7" fill="#fff7de"/>
  <circle cx="346" cy="420" r="7" fill="#fff7de"/>
  <path d="M316 448 C328 458,342 458,354 446" stroke="#fff7de" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="thn" d="M330 466 v34 M310 498 l20 -10 l20 10" />
  <!-- stamp arm -->
  <path class="ln" d="M360 415 l70 -12" stroke-width="6"/>
  <rect x="410" y="385" width="70" height="56" rx="6" fill="#d84a35" stroke="#111" stroke-width="3" transform="rotate(-12 445 413)"/>
  <text x="425" y="422" font-size="30" font-family="Marker Felt, Comic Sans MS, cursive" fill="#fff" transform="rotate(-12 445 413)">拒绝</text>

  <!-- denied note flying out -->
  <path class="wh" d="M680 250 L880 236 L900 340 L660 356 Z"/>
  <text class="md" x="705" y="300">Error: 无权限</text>
  <path class="thn" d="M610 320 C640 290,660 272,688 286"/>

  <!-- result tag -->
  <path class="tg" d="M990 270 L1240 252 L1260 396 L965 410 Z"/>
  <text class="lg" x="1020" y="330">post-result</text>
  <text class="sm" x="1018" y="376">需要 post-execute</text>

  <!-- funnel of post-execute -->
  <path class="thn" d="M1100 410 l0 80"/>
  <path class="tg" d="M970 500 L1240 482 L1270 620 L940 636 Z"/>
  <text class="md" x="1030" y="560">post-execute</text>
  <text class="sm" x="1028" y="605">审计 / 替换 / block</text>

  <!-- arrows -->
  <path class="thn" d="M470 450 C500 450,520 448,545 442"/>
  <path class="thn" d="M886 320 C920 306,952 300,985 310"/>
  <path class="thn" d="M1130 640 C1130 700,1130 730,1130 770"/>

  <!-- bottom note -->
  <path class="bl" d="M900 780 L1310 762 L1330 848 L878 862 Z"/>
  <text class="md" x="940" y="832">拒绝结果仍回到上下文</text>
</svg>