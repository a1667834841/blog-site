<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t00 d00">
  <title id="t00">Agent tool call overview</title>
  <desc id="d00">Agent main loop with tool call: model generates, executes tool, appends observation back to context.</desc>
  <defs>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter>
    <filter id="rg"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter>
    <pattern id="pg" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fbf8ef"/>
      <circle cx="12" cy="18" r="1.2" fill="#d9c8aa" opacity="0.35"/>
      <circle cx="48" cy="36" r="0.9" fill="#d7c4a7" opacity="0.3"/>
      <path d="M6 58 C20 50,35 66,59 52" stroke="#e2d5bd" stroke-width="1" fill="none" opacity="0.35"/>
    </pattern>
    <style>
      .bg{fill:url(#pg)}
      .ln{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .th{fill:none;stroke:#df6d16;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .thn{fill:none;stroke:#df6d16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .ds{fill:none;stroke:#171717;stroke-width:3.5;stroke-dasharray:12 12;stroke-linecap:round;filter:url(#rg)}
      .tg{fill:#d7b98a;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .tg2{fill:#ead6b4;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .bl{fill:#b8d2df;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .wh{fill:#fffdf7;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .rd{fill:#d84a35;color:#d84a35}
      .sm{font:28px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .md{font:38px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .lg{font:48px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .rt{font:32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#d84a35}
      .bt{font:30px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#227093}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <!-- title -->
  <path class="bl" d="M80 62 L468 44 L484 140 L62 145 Z"/>
  <text class="lg" x="130" y="122">Agent 工具调用</text>

  <!-- main loop ring -->
  <ellipse cx="720" cy="480" rx="420" ry="220" class="th" stroke-dasharray="16 20" fill="none" stroke-width="9"/>

  <!-- node 1: model generate -->
  <path class="tg" d="M440 280 L690 262 L700 401 L425 412 Z"/>
  <text class="lg" x="485" y="340">模型生成</text>
  <text class="sm" x="488" y="390">生成响应</text>
  <circle cx="540" cy="302" r="18" fill="#f6efe2" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M540 302 v-14 M540 302 l12 8"/>

  <!-- node 2: tool exec -->
  <path class="tg" d="M930 304 L1213 274 L1235 436 L908 453 Z"/>
  <text class="lg" x="991" y="360">执行工具</text>
  <text class="sm" x="990" y="408">遍历 ToolCalls</text>
  <circle cx="1090" cy="328" r="18" fill="#f6efe2" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M1090 328 v-14 M1090 328 l12 8"/>

  <!-- node 3: observation -->
  <path class="tg" d="M910 556 L1230 536 L1250 712 L885 726 Z"/>
  <text class="lg" x="995" y="625">追加 Observation</text>
  <text class="sm" x="990" y="678">工具结果写回上下文</text>
  <circle cx="1090" cy="590" r="18" fill="#f6efe2" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M1090 590 v-14 M1090 590 l12 8"/>

  <!-- node 4: done -->
  <path class="tg" d="M355 568 L667 540 L680 716 L330 737 Z"/>
  <text class="lg" x="425" y="635">无工具调用?</text>
  <text class="md" x="425" y="690">完成</text>
  <circle cx="519" cy="590" r="24" fill="none" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M519 590 v-18 M519 590 l16 10"/>

  <!-- xiaohei at tool exec -->
  <ellipse cx="1170" cy="380" rx="28" ry="30" fill="#161616" filter="url(#rg)"/>
  <circle cx="1158" cy="372" r="6" fill="#fff7de"/>
  <circle cx="1182" cy="372" r="6" fill="#fff7de"/>
  <path d="M1158 396 C1164 404,1176 404,1182 396" stroke="#fff7de" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path class="thn" d="M1170 410 v26" />
  <path class="thn" d="M1152 436 l18 -8 l18 8" />
  <!-- hand pushing tool -->
  <path class="ln" d="M1200 380 l24 0" stroke-width="5"/>
  <circle cx="1230" cy="380" r="14" fill="none" stroke="#df6d16" stroke-width="4"/>
  <path class="thn" d="M1230 380 v-10 M1230 380 l8 5"/>

  <!-- context box -->
  <path class="bl" d="M80 484 L290 466 L300 646 L65 658 Z"/>
  <text class="md" x="122" y="530">上下文</text>
  <text class="sm" x="122" y="574">- 历史记录</text>
  <text class="sm" x="122" y="614">- 工具描述</text>
  <text class="sm" x="122" y="650">- 执行结果</text>

  <!-- arrows between nodes -->
  <path class="thn" d="M700 340 C785 336,810 340,890 342"/>
  <path class="thn" d="M907 555 C830 540,808 534,718 540"/>
  <path class="thn" d="M673 628 C605 584,560 466,538 410"/>
  <path class="thn" d="M540 628 C462 612,378 558,340 486"/>
  <path class="thn" d="M358 458 C420 436,510 400,554 382"/>

  <!-- callout -->
  <path class="ds" d="M1260 340 C1320 316,1380 319,1408 360 C1440 406,1405 446,1330 452 L1248 450 C1198 440,1200 368,1260 340 Z"/>
  <text class="md" x="1270" y="400">main loop</text>
  <text class="sm" x="1270" y="445">反复循环</text>

  <!-- bottom note -->
  <path class="bl" d="M80 782 L410 767 L430 847 L63 858 Z"/>
  <text class="md" x="120" y="828">工具描述植入 → 模型判断 → 执行 → 观察写回</text>
</svg>