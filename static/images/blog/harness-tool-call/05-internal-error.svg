<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t05 d05">
  <title id="t05">Harness internal error</title>
  <desc id="d05">Scheduler dispatch rejects, records schedulerFailure, no tool result constructed, throws to turn boundary.</desc>
  <defs>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter>
    <filter id="rg"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter>
    <pattern id="pg" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fbf8ef"/>
      <circle cx="12" cy="18" r="1.2" fill="#d9c8aa" opacity="0.35"/>
      <circle cx="48" cy="36" r="0.9" fill="#d7c4a7" opacity="0.3"/>
      <path d="M6 58 C20 50,35 66,59 52" stroke="#e2d5bd" stroke-width="1" fill="none" opacity="0.35"/>
    </pattern>
    <style>
      .bg{fill:url(#pg)}
      .ln{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .th{fill:none;stroke:#df6d16;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .thn{fill:none;stroke:#df6d16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .ds{fill:none;stroke:#171717;stroke-width:3.5;stroke-dasharray:12 12;stroke-linecap:round;filter:url(#rg)}
      .tg{fill:#d7b98a;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .tg2{fill:#ead6b4;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .bl{fill:#b8d2df;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .wh{fill:#fffdf7;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .sm{font:28px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .md{font:38px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .lg{font:48px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .rt{font:32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#d84a35}
      .bt{font:30px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#227093}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <!-- title -->
  <path class="bl" d="M80 62 L470 44 L486 142 L62 147 Z"/>
  <text class="lg" x="120" y="123">harness 内部出错</text>

  <!-- scheduler -->
  <path class="tg2" d="M280 240 L560 214 L580 420 L255 444 Z"/>
  <text class="lg" x="330" y="340">调度器</text>
  <text class="sm" x="335" y="390">dispatch</text>
  <!-- crack / lightning -->
  <path class="ln" d="M430 180 l40 70 l-50 0 l45 80" stroke="#d84a35" stroke-width="7" fill="none"/>
  <circle cx="455" cy="210" r="24" fill="none" stroke="#d84a35" stroke-width="4"/>

  <!-- reject arrow -->
  <path class="thn" d="M580 320 C660 300,720 290,800 296"/>

  <!-- schedulerFailure -->
  <path class="tg" d="M800 220 L1040 204 L1060 330 L780 345 Z"/>
  <text class="md" x="830" y="285">schedulerFailure</text>
  <text class="sm" x="830" y="330">记录错误，不构造 result</text>
  <circle cx="970" cy="255" r="20" fill="#d84a35" stroke="#111" stroke-width="3"/>
  <text x="959" y="265" font-size="28" font-family="Marker Felt, Comic Sans MS, cursive" fill="#fff">✕</text>

  <!-- xiaohei pulling lever -->
  <ellipse cx="800" cy="560" rx="34" ry="36" fill="#161616" filter="url(#rg)"/>
  <circle cx="784" cy="550" r="7" fill="#fff7de"/>
  <circle cx="816" cy="550" r="7" fill="#fff7de"/>
  <path d="M786 578 C798 588,812 588,824 576" stroke="#fff7de" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="thn" d="M800 596 v30 M780 626 l20 -10 l20 10" />
  <path class="thn" d="M820 545 l110 25"/>
  <circle cx="930" cy="572" r="26" fill="none" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M930 572 v-16 M930 572 l14 9"/>
  <!-- lever box -->
  <path class="wh" d="M900 620 L1120 604 L1140 720 L880 736 Z"/>
  <text class="md" x="950" y="672">throw 到 turn 边界</text>
  <path class="thn" d="M930 600 l0 22"/>

  <!-- turn -->
  <path class="bl" d="M1200 460 L1450 442 L1470 590 L1180 605 Z"/>
  <text class="lg" x="1240" y="520">turn()</text>
  <text class="sm" x="1240" y="568">kind: error</text>
  <path class="thn" d="M1040 520 C1110 520,1140 516,1195 505"/>

  <!-- driver -->
  <path class="tg" d="M1200 640 L1450 622 L1470 780 L1180 792 Z"/>
  <text class="md" x="1250" y="702">driver 处理</text>
  <path class="thn" d="M1320 590 l0 40"/>

  <!-- key feature -->
  <path class="ds" d="M140 600 C220 580,260 556,330 500"/>
  <path class="wh" d="M60 640 L430 620 L450 760 L40 776 Z" transform="rotate(-3 245 700)"/>
  <text class="rt" x="120" y="690">不构造 tool/result</text>
  <text class="bt" x="120" y="738">模型看不到任何反馈</text>
</svg>