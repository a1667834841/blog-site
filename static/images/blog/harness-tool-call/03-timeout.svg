<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t03 d03">
  <title id="t03">Tool timeout</title>
  <desc id="d03">Timeout policy: deadline signal replaces result with toolTimeoutResult, cooperative not forced kill.</desc>
  <defs>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter>
    <filter id="rg"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter>
    <pattern id="pg" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fbf8ef"/>
      <circle cx="12" cy="18" r="1.2" fill="#d9c8aa" opacity="0.35"/>
      <circle cx="48" cy="36" r="0.9" fill="#d7c4a7" opacity="0.3"/>
      <path d="M6 58 C20 50,35 66,59 52" stroke="#e2d5bd" stroke-width="1" fill="none" opacity="0.35"/>
    </pattern>
    <style>
      .bg{fill:url(#pg)}
      .ln{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .th{fill:none;stroke:#df6d16;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .thn{fill:none;stroke:#df6d16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .ds{fill:none;stroke:#171717;stroke-width:3.5;stroke-dasharray:12 12;stroke-linecap:round;filter:url(#rg)}
      .tg{fill:#d7b98a;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .tg2{fill:#ead6b4;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .bl{fill:#b8d2df;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .wh{fill:#fffdf7;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .sm{font:28px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .md{font:38px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .lg{font:48px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .rt{font:32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#d84a35}
      .bt{font:30px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#227093}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <!-- title -->
  <path class="bl" d="M80 62 L470 44 L486 142 L62 147 Z"/>
  <text class="lg" x="120" y="123">调用失败 · 超时</text>

  <!-- hourglass -->
  <path class="ln" d="M520 220 l180 0 M520 220 l-40 60 l40 80 l80 0 l40 -80 l-40 -60 z" stroke-width="5"/>
  <path class="ln" d="M520 340 l180 0" stroke-width="4"/>
  <path class="thn" d="M610 220 l0 120" />
  <circle cx="610" cy="280" r="10" fill="#161616"/>
  <!-- grains -->
  <circle cx="570" cy="360" r="7" fill="#d7b98a"/>
  <circle cx="600" cy="368" r="6" fill="#d7b98a"/>
  <circle cx="632" cy="362" r="7" fill="#d7b98a"/>
  <circle cx="586" cy="380" r="5" fill="#d7b98a"/>

  <!-- deadline clock -->
  <circle cx="610" cy="120" r="55" fill="none" stroke="#d84a35" stroke-width="6"/>
  <path class="ln" d="M610 120 v-32 M610 120 l26 10"/>
  <text x="596" y="100" font-size="30" font-family="Marker Felt, Comic Sans MS, cursive" fill="#d84a35">ms</text>

  <!-- xiaohei watching -->
  <ellipse cx="300" cy="400" rx="34" ry="36" fill="#161616" filter="url(#rg)"/>
  <circle cx="284" cy="390" r="7" fill="#fff7de"/>
  <circle cx="316" cy="390" r="7" fill="#fff7de"/>
  <path d="M286 418 C298 428,312 428,324 416" stroke="#fff7de" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="thn" d="M300 436 v30 M280 466 l20 -10 l20 10" />
  <path class="ln" d="M342 392 l30 -6" stroke-width="6"/>
  <circle cx="380" cy="384" r="16" fill="none" stroke="#df6d16" stroke-width="4"/>
  <path class="thn" d="M380 384 v-10 M380 384 l8 6"/>

  <!-- result -->
  <path class="tg" d="M990 260 L1290 242 L1312 398 L962 415 Z"/>
  <text class="lg" x="1020" y="322">toolTimeoutResult</text>
  <text class="sm" x="1020" y="372">timed out after ms</text>
  <circle cx="1200" cy="300" r="22" fill="#d84a35" stroke="#111" stroke-width="3"/>
  <text x="1188" y="311" font-size="30" font-family="Marker Felt, Comic Sans MS, cursive" fill="#fff">!</text>

  <!-- swap arrows -->
  <path class="thn" d="M880 320 C910 300,948 288,988 290"/>
  <path class="thn" d="M790 440 C860 480,930 500,1000 510"/>

  <!-- signal path -->
  <path class="thn" d="M690 300 C760 310,820 320,880 330" stroke-dasharray="10 10"/>
  <path class="ln" d="M705 300 l10 14 M715 300 l10 14 M725 300 l10 14" />

  <!-- bottom notes -->
  <path class="bl" d="M200 780 L620 762 L640 848 L180 862 Z"/>
  <text class="md" x="240" y="822">不是强杀，是协作式信号</text>
  <text class="sm" x="240" y="856">deadline 先 abort，harness 不等它</text>
  <path class="bl" d="M900 780 L1330 762 L1350 848 L878 862 Z"/>
  <text class="md" x="940" y="832">替换结果文本</text>
</svg>