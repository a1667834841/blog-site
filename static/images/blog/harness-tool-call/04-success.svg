<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t04 d04">
  <title id="t04">Tool call success</title>
  <desc id="d04">Tool body returns successfully, output validated, deepFrozen, rendered, appended to context.</desc>
  <defs>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.12"/></filter>
    <filter id="rg"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/></filter>
    <pattern id="pg" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fbf8ef"/>
      <circle cx="12" cy="18" r="1.2" fill="#d9c8aa" opacity="0.35"/>
      <circle cx="48" cy="36" r="0.9" fill="#d7c4a7" opacity="0.3"/>
      <path d="M6 58 C20 50,35 66,59 52" stroke="#e2d5bd" stroke-width="1" fill="none" opacity="0.35"/>
    </pattern>
    <style>
      .bg{fill:url(#pg)}
      .ln{fill:none;stroke:#171717;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .th{fill:none;stroke:#df6d16;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .thn{fill:none;stroke:#df6d16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;filter:url(#rg)}
      .ds{fill:none;stroke:#171717;stroke-width:3.5;stroke-dasharray:12 12;stroke-linecap:round;filter:url(#rg)}
      .tg{fill:#d7b98a;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .tg2{fill:#ead6b4;stroke:#171717;stroke-width:2.5;filter:url(#ps)}
      .bl{fill:#b8d2df;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .wh{fill:#fffdf7;stroke:#171717;stroke-width:2.2;filter:url(#ps)}
      .sm{font:28px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .md{font:38px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .lg{font:48px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#111}
      .rt{font:32px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#d84a35}
      .bt{font:30px 'Marker Felt','Comic Sans MS','Kaiti SC',cursive;fill:#227093}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <!-- title -->
  <path class="bl" d="M80 62 L470 44 L486 142 L62 147 Z"/>
  <text class="lg" x="120" y="123">调用成功</text>

  <!-- tool body -->
  <path class="tg2" d="M180 230 L430 206 L450 380 L160 400 Z"/>
  <text class="lg" x="240" y="320">tool</text>
  <text class="sm" x="245" y="372">execute()</text>
  <circle cx="345" cy="260" r="18" fill="#f6efe2" stroke="#111" stroke-width="4"/>
  <path class="ln" d="M345 260 v-14 M345 260 l12 8"/>

  <!-- xiaohei with stamp -->
  <ellipse cx="440" cy="500" rx="34" ry="36" fill="#161616" filter="url(#rg)"/>
  <circle cx="424" cy="490" r="7" fill="#fff7de"/>
  <circle cx="456" cy="490" r="7" fill="#fff7de"/>
  <path d="M426 518 C438 528,452 528,464 516" stroke="#fff7de" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="thn" d="M440 536 v30 M420 566 l20 -10 l20 10" />
  <path class="ln" d="M480 490 l60 -10" stroke-width="6"/>
  <rect x="520" y="466" width="66" height="52" rx="6" fill="#227093" stroke="#111" stroke-width="3" transform="rotate(-8 553 492)"/>
  <text x="535" y="500" font-size="28" font-family="Marker Felt, Comic Sans MS, cursive" fill="#fff" transform="rotate(-8 553 492)">通过</text>

  <!-- output -->
  <path class="wh" d="M560 180 L790 162 L810 290 L540 305 Z"/>
  <text class="md" x="590" y="240">输出 JSON</text>
  <path class="thn" d="M450 300 C500 280,522 268,558 252"/>

  <!-- pipeline -->
  <path class="thn" d="M800 220 C880 210,910 206,970 210"/>
  <path class="thn" d="M970 210 C990 210,1010 210,1030 210"/>

  <!-- validate schema -->
  <path class="tg" d="M1040 148 L1260 132 L1280 256 L1020 270 Z"/>
  <text class="md" x="1070" y="210">验证 schema</text>
  <circle cx="1180" cy="186" r="16" fill="none" stroke="#111" stroke-width="3"/>
  <path class="ln" d="M1180 186 v-10 M1180 186 l8 6"/>

  <!-- deepFreeze -->
  <path class="tg" d="M1040 292 L1260 276 L1280 400 L1020 414 Z"/>
  <text class="md" x="1070" y="350">deepFreeze</text>
  <path class="thn" d="M1150 270 l0 30"/>

  <!-- render -->
  <path class="tg" d="M1040 436 L1260 420 L1280 544 L1020 558 Z"/>
  <text class="md" x="1070" y="496">渲染成文本</text>
  <path class="thn" d="M1150 400 l0 30"/>

  <!-- observation -->
  <path class="bl" d="M1040 580 L1280 562 L1300 700 L1020 716 Z"/>
  <text class="md" x="1090" y="640">追加 Observation</text>
  <text class="sm" x="1090" y="685">写回上下文</text>
  <path class="thn" d="M1150 544 l0 30"/>

  <!-- bottom note -->
  <path class="bl" d="M200 780 L620 762 L640 848 L180 862 Z"/>
  <text class="md" x="240" y="832">isError: false  → 正常流程</text>
</svg>